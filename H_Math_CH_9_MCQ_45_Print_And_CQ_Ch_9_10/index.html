        const bnOptions = ["ক", "খ", "গ", "ঘ"];

        function setLanguage(lang) {
            currentLang = lang;
            
            // Update Active Buttons
            document.getElementById('lang-bn').className = lang === 'bn' 
                ? 'px-3 py-1.5 bg-green-500 text-white rounded text-sm font-bold shadow-inner border-2 border-green-700' 
                : 'px-3 py-1.5 bg-gray-700 text-white rounded text-sm font-medium hover:bg-gray-600 transition';
            
            document.getElementById('lang-en').className = lang === 'en' 
                ? 'px-3 py-1.5 bg-blue-500 text-white rounded text-sm font-bold shadow-inner border-2 border-blue-700' 
                : 'px-3 py-1.5 bg-gray-700 text-white rounded text-sm font-medium hover:bg-gray-600 transition';

            // Update Header Text
            document.getElementById('doc-title').innerText = uiText[lang].title;
            document.getElementById('doc-subject').innerText = uiText[lang].subject;
            document.getElementById('doc-time').innerText = uiText[lang].time;
            document.getElementById('doc-marks').innerText = uiText[lang].marks;

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-render-area');
            container.innerHTML = ''; 

            questionsData.forEach((q, index) => {
                const questionText = currentLang === 'bn' ? q.q_bn : q.q_en;
                const optionLabels = currentLang === 'bn' ? bnOptions : enOptions;
                
                // Keep Roman numerals for multichoice questions if they exist in English options
                let opts = q.options;
                if (currentLang === 'bn' && q.id >= 23 && q.id <= 34) {
                     // The options arrays for multiple-statement questions contain roman numerals in Bangla version too
                     opts = ["i ও ii", "i ও iii", "ii ও iii", "i, ii ও iii"];
                }

                let optionsHTML = '';
                opts.forEach((opt, oIdx) => {
                    optionsHTML += `
                        <div class="flex">
                            <span class="mr-1">(${optionLabels[oIdx]})</span> 
                            <span>${opt}</span>
                        </div>
                    `;
                });

                const qCard = `
                    <div class="question-block">
                        <div class="flex font-semibold">
                            <span class="mr-1">${index + 1}.</span>
                            <span>${questionText}</span>
                        </div>
                        <div class="options-grid">
                            ${optionsHTML}
                        </div>
                    </div>
                `;
                container.innerHTML += qCard;
            });

            // Re-typeset MathJax after rendering
            if (window.MathJax && MathJax.typesetPromise) {
                document.getElementById('loading-indicator').style.display = 'inline-block';
                MathJax.typesetPromise([container]).then(() => {
                    document.getElementById('loading-indicator').style.display = 'none';
                }).catch((err) => console.log('MathJax Error:', err));
            }
        }

        function triggerPrint() {
            window.print();
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage('en');
        });
    </script>
